<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
@page{size:1080px 1350px;margin:0}
body{margin:0;background:#0b0b0b;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:1080px;height:1350px;page-break-after:always;overflow:hidden}
.pg:last-child{page-break-after:auto}
</style>
<script src="kit.js"></script><script src="kit2.js"></script><script src="ideas.js"></script><script src="ideas10.js"></script>
</head><body><div id="root"></div>
<script>
const i=+new URLSearchParams(location.search).get('i')||0;
const pages=IDEAS10[i].pages();
document.getElementById('root').innerHTML=pages.map(s=>`<div class="pg">${s}</div>`).join('');
document.fonts.ready.then(()=>Promise.all([...document.querySelectorAll('image')].map(im=>new Promise(r=>{const x=new Image();x.onload=x.onerror=r;x.src=im.getAttribute('href')})))).then(()=>setTimeout(()=>window.READY=1,300));
</script></body></html>
